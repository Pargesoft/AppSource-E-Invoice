name: Playwright UI + API Tests (Manual)

on:
  workflow_dispatch:



permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  playwright-tests:
    defaults:
      run:
        working-directory: PlaywrightTests
    runs-on: windows-latest
    environment: LocalizationSandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PlaywrightTests/package-lock.json

      - name: Install dependencies (npm ci)
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            Write-Host "Found package-lock.json — running npm ci"
            npm ci --no-audit --no-fund --prefer-offline
          } else {
            Write-Host "No package-lock.json — running npm install"
            npm install --no-audit --no-fund
          }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        env:
          BC_BASE_URL: ${{ secrets.BC_BASE_URL }}
          BC_USERNAME: ${{ secrets.BC_USERNAME }}
          BC_PASSWORD: ${{ secrets.BC_PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
        run: |
          npx playwright test --project=chromium-tests

# - name: Run API tests (optional)
#   continue-on-error: true
#   env:
#     BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
#     BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
#     BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
#     BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
#     BC_BASE_URL: ${{ secrets.BC_BASE_URL }}
#     BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
#   run: |
#     npx playwright test --project=api


      - name: Upload Playwright HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: PlaywrightTests/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Pages site (Playwright report)
        if: always()
        shell: pwsh
        run: |
          $siteDir = Join-Path $env:GITHUB_WORKSPACE "public"
          if (Test-Path $siteDir) { Remove-Item -Recurse -Force $siteDir }
          New-Item -ItemType Directory -Force -Path $siteDir | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "PlaywrightTests\playwright-report\*") `
                    -Destination $siteDir `
                    -Recurse -Force

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    if: always()
    needs: playwright-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Notify Teams (Playwright report)
        if: always()
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PAGES_URL: https://pargesoft.github.io/AppSource-E-Invoice/
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          payload="$(jq -n \
            --arg pages "$PAGES_URL" \
            --arg run "$RUN_URL" \
            '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      { "type": "TextBlock", "text": "✅ Playwright smoke testleri tamamlandı.", "wrap": true, "weight": "Bolder" }
                    ],
                    "actions": [
                      { "type": "Action.OpenUrl", "title": "Test Raporu", "url": $pages },
                      { "type": "Action.OpenUrl", "title": "Run Detayları", "url": $run }
                    ]
                  }
                }
              ]
            }'
          )"

          curl -H "Content-Type: application/json" -d "$payload" "$TEAMS_WEBHOOK_URL"



name: Playwright UI + API Tests (Manual)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: PlaywrightTests

# ✅ GitHub Pages deploy için gerekli izinler
permissions:
  contents: read
  pages: write
  id-token: write

# (Opsiyonel) Aynı anda birden fazla deploy olmasın
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: windows-latest
    environment: LocalizationSandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PlaywrightTests/package-lock.json

      - name: Install dependencies (npm ci)
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            Write-Host "Found package-lock.json — running npm ci"
            npm ci --no-audit --no-fund --prefer-offline
          } else {
            Write-Host "No package-lock.json — running npm install"
            npm install --no-audit --no-fund
          }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI tests
        env:
          BC_BASE_URL: ${{ secrets.BC_BASE_URL }}
          BC_USERNAME: ${{ secrets.BC_USERNAME }}
          BC_PASSWORD: ${{ secrets.BC_PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
        run: |
          npx playwright test --project=chromium-tests

      - name: Run API tests (optional)
        continue-on-error: true
        env:
          BC_TENANT_ID: ${{ secrets.BC_TENANT_ID }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_COMPANY_ID: ${{ secrets.BC_COMPANY_ID }}
          BC_BASE_URL: ${{ secrets.BC_BASE_URL }}
          BC_ENVIRONMENT: ${{ secrets.BC_ENVIRONMENT }}
        run: |
          npx playwright test --project=api

      # ✅ Playwright HTML report zaten playwright-report altında oluşur.
      # Eğer kapanırsa diye "if: always()" ile garantiye alıyoruz.
      - name: Upload Playwright HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: PlaywrightTests/playwright-report
          if-no-files-found: warn
          retention-days: 7

      # ✅ GitHub Pages'e publish edeceğimiz "site" klasörünü hazırlıyoruz
      - name: Prepare Pages site (Playwright report)
        if: always()
        shell: pwsh
        run: |
          # defaults.working-directory = PlaywrightTests olduğu için repo köküne çıkıyoruz
          $siteDir = Join-Path $env:GITHUB_WORKSPACE "public"

          # temiz kurulum: önce varsa sil, sonra yeniden oluştur
          if (Test-Path $siteDir) { Remove-Item -Recurse -Force $siteDir }
          New-Item -ItemType Directory -Force -Path $siteDir | Out-Null

          # PlaywrightTests/playwright-report içeriğini repo kökü public'e kopyala
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "PlaywrightTests\playwright-report\*") `
                    -Destination $siteDir `
                    -Recurse -Force

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public


  deploy-pages:
    if: always()
    needs: playwright-tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
